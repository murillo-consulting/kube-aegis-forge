name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - name: Test atomic GitOps promotion and input validation
        run: python -m unittest discover -s ../scripts/tests -v

  container:
    name: Restricted container startup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the reviewed image
        run: docker build --tag aegis-ci:test .
      - name: Verify startup with the restricted runtime contract
        run: |
          docker run --detach --name aegis-ci --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:18081:8080 aegis-ci:test
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18081/health/ready | grep -Fq '"status":"ready"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs aegis-ci
          exit 1
      - name: Remove the disposable test container
        if: always()
        run: docker rm --force aegis-ci || true

  kubernetes:
    name: Helm, Kubernetes, and Kyverno
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install uv for ingress contract checks
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Verify controller, routing and network-policy contracts
        run: uv run --locked --script scripts/check-ingress.py
      - name: Lint and render chart
        run: |
          helm lint platform/charts/demo-api \
            --values platform/environments/local/values.yaml \
            --values platform/environments/local/image-values.yaml
          helm template demo-api platform/charts/demo-api \
            --namespace demo \
            --values platform/environments/local/values.yaml \
            --values platform/environments/local/image-values.yaml \
            > rendered.yaml
      - name: Validate rendered Kubernetes resources
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary -ignore-missing-schemas /workspace/rendered.yaml
      - name: Test Kyverno policies
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            ghcr.io/kyverno/kyverno-cli@sha256:7224ed05508c24419c3df98114c28ba682ad0a940dcdb7b9fdba0a4b6bf943cf \
            test /workspace/platform/policies/tests

  ingress:
    name: Traefik HTTP, TLS and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          install_only: true
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Prepare the isolated ingress fixture
        run: |
          export KUBECONFIG="$RUNNER_TEMP/aegis-ingress-kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          uv run --locked --script scripts/check-ingress.py --output "$RUNNER_TEMP/ingress"
          git fetch --depth=1 origin gitops
          git show FETCH_HEAD:platform/environments/local/image-values.yaml > "$RUNNER_TEMP/ingress/image-values.yaml"
          cat "$RUNNER_TEMP/ingress/image-values.yaml"
          kind create cluster --name aegis-ingress-ci --config "$RUNNER_TEMP/ingress/kind.yaml" --wait 180s
      - name: Exercise the reviewed charts with a released application digest
        run: bash scripts/test-ingress.sh kind-aegis-ingress-ci "$RUNNER_TEMP/ingress/image-values.yaml"
      - name: Capture ingress diagnostics
        if: failure()
        run: |
          kubectl --context kind-aegis-ingress-ci get pods,services,ingresses -A -o wide || true
          kubectl --context kind-aegis-ingress-ci -n traefik logs deployment/traefik --all-pods=true --tail=100 || true
      - name: Delete only the disposable ingress cluster
        if: always()
        run: kind delete cluster --name aegis-ingress-ci

  opentofu:
    name: OpenTofu format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra/aws/bootstrap init -backend=false
      - run: tofu -chdir=infra/aws/bootstrap validate
      - run: tofu -chdir=infra/aws/bootstrap test
      - run: tofu -chdir=infra/aws/eks init -backend=false
      - run: tofu -chdir=infra/aws/eks validate
      - run: tofu -chdir=infra/aws/eks test

  iac-security:
    name: IaC misconfiguration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan OpenTofu configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_TF_EXCLUDE_DOWNLOADED_MODULES: "true"
        with:
          scan-type: config
          scan-ref: infra
          skip-dirs: infra/aws/bootstrap/.terraform,infra/aws/eks/.terraform
          version: v0.72.0
          severity: HIGH,CRITICAL
          exit-code: "1"

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: zricethezav/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  filesystem:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.72.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
