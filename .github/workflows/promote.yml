name: Promote verified image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - aws
      digest:
        description: Previously released sha256 digest
        required: true
        type: string

permissions:
  contents: write
  packages: read
  attestations: read

concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/murillo-consulting/kube-aegis-forge

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Validate digest input
        env:
          DIGEST: ${{ inputs.digest }}
        run: python scripts/update-image-values.py --check-digest "$DIGEST"
      - name: Re-verify release evidence
        env:
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-artifact.sh "$IMAGE@$DIGEST"
      - name: Check out GitOps state
        run: |
          git fetch origin gitops
          git worktree add gitops-state origin/gitops
      - name: Promote to AWS
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          python scripts/update-image-values.py \
            --root gitops-state \
            --environment aws \
            --repository "$IMAGE" \
            --digest "$DIGEST" \
            --version "manual"
          git -C gitops-state config user.name github-actions[bot]
          git -C gitops-state config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C gitops-state add platform/environments/aws/image-values.yaml
          git -C gitops-state commit -m "promote(aws): ${DIGEST}"
          git -C gitops-state push origin HEAD:gitops
