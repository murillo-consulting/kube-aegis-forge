name: AWS infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to perform
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      admin_cidrs:
        description: JSON list of narrow trusted CIDRs, for example ["203.0.113.4/32"]
        required: true
        type: string
      cluster_admin_role_arn:
        description: Existing IAM role ARN to grant through an explicit EKS access entry
        required: true
        type: string
      confirmation:
        description: For destroy only, enter kube-aegis-forge
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_admin_cidrs: ${{ inputs.admin_cidrs }}
  TF_VAR_cluster_admin_role_arn: ${{ inputs.cluster_admin_role_arn }}

jobs:
  plan:
    name: Create immutable plan
    if: inputs.operation == 'plan' || inputs.operation == 'apply'
    runs-on: ubuntu-24.04
    environment: aws
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure short-lived AWS plan credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - name: Initialize remote state
        run: |
          tofu -chdir=infra/aws/eks init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=eks/kube-aegis-forge.tfstate" \
            -backend-config="use_lockfile=true"
      - name: Create and hash plan
        run: |
          tofu -chdir=infra/aws/eks plan -out=tfplan
          sha256sum infra/aws/eks/tfplan > infra/aws/eks/tfplan.sha256
          tofu -chdir=infra/aws/eks show -no-color tfplan > infra/aws/eks/tfplan.txt
      - name: Upload exact plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-plan-${{ github.run_id }}
          path: |
            infra/aws/eks/tfplan
            infra/aws/eks/tfplan.sha256
            infra/aws/eks/tfplan.txt
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Approve and apply exact plan
    if: inputs.operation == 'apply'
    needs: plan
    runs-on: ubuntu-24.04
    environment: aws-apply
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download approved plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aws-plan-${{ github.run_id }}
          path: infra/aws/eks
      - name: Verify plan hash
        run: sha256sum --check infra/aws/eks/tfplan.sha256
      - name: Configure short-lived AWS apply credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - name: Initialize provider and apply the saved plan
        run: |
          tofu -chdir=infra/aws/eks init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=eks/kube-aegis-forge.tfstate" \
            -backend-config="use_lockfile=true"
          sha256sum --check infra/aws/eks/tfplan.sha256
          tofu -chdir=infra/aws/eks apply tfplan

  destroy:
    name: Explicitly destroy EKS resources
    if: inputs.operation == 'destroy'
    runs-on: ubuntu-24.04
    environment: aws-apply
    timeout-minutes: 40
    steps:
      - name: Require exact project confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "kube-aegis-forge"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure short-lived AWS apply credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - name: Destroy EKS resources but retain state bucket
        run: |
          tofu -chdir=infra/aws/eks init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=eks/kube-aegis-forge.tfstate" \
            -backend-config="use_lockfile=true"
          tofu -chdir=infra/aws/eks destroy -auto-approve

