name: Roll back GitOps digest

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        required: true
        type: choice
        options:
          - local
          - aws
      digest:
        description: Previously verified sha256 digest
        required: true
        type: string

permissions:
  contents: write
  packages: read
  attestations: read

concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/murillo-consulting/kube-aegis-forge

jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Re-verify selected digest
        env:
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update-image-values.py --check-digest "$DIGEST"
          bash scripts/verify-artifact.sh "$IMAGE@$DIGEST"
      - name: Record rollback in GitOps history
        env:
          DIGEST: ${{ inputs.digest }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          git fetch origin gitops
          git worktree add gitops-state origin/gitops
          python scripts/update-image-values.py \
            --root gitops-state \
            --environment "$TARGET_ENVIRONMENT" \
            --repository "$IMAGE" \
            --digest "$DIGEST" \
            --version "rollback"
          git -C gitops-state config user.name github-actions[bot]
          git -C gitops-state config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C gitops-state add "platform/environments/$TARGET_ENVIRONMENT/image-values.yaml"
          git -C gitops-state commit -m "rollback(${TARGET_ENVIRONMENT}): ${IMAGE}@${DIGEST}"
          git -C gitops-state push origin HEAD:gitops
