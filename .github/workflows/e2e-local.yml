name: Local GitOps end-to-end

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-local
  cancel-in-progress: false

jobs:
  kind:
    name: Bootstrap, verify policies, and test self-healing
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          install_only: true
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install OpenTofu required by the workstation contract
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
      - name: Bootstrap platform through Argo CD
        run: bash scripts/local.sh up
      - name: Run acceptance checks
        run: bash scripts/local.sh verify
      - name: Capture diagnostic state on failure
        if: failure()
        run: |
          kubectl --context kind-kube-aegis-forge get nodes -o wide || true
          kubectl --context kind-kube-aegis-forge -n argocd get applications -o wide || true
          kubectl --context kind-kube-aegis-forge get pods -A -o wide || true
          kubectl --context kind-kube-aegis-forge -n argocd logs statefulset/argocd-application-controller --tail=300 || true
      - name: Delete the isolated test cluster
        if: always()
        run: bash scripts/local.sh down
