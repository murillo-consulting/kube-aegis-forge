version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    ignore:
      # Keep the development toolchain inside the reviewed major versions.
      - dependency-name: mypy
        update-types:
          - version-update:semver-major
    groups:
      python-runtime:
        dependency-type: production
      python-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Python 3.13 is an explicit v1 platform contract.
      - dependency-name: python
        update-types:
          - version-update:semver-major

  - package-ecosystem: terraform
    directory: /infra/aws/bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/aws/eks
    schedule:
      interval: weekly
