apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.4.0
    helm:
      releaseName: traefik
      skipCrds: true
      valuesObject:
        image:
          digest: sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
        versionOverride: v3.7.12
        deployment:
          replicas: 2
        ingressClass:
          name: traefik
          isDefaultClass: false
        providers:
          kubernetesCRD:
            enabled: false
          kubernetesGateway:
            enabled: false
          kubernetesIngress:
            enabled: true
            ingressClass: traefik
            namespaces:
              - demo
            strictPrefixMatching: true
            publishedService:
              enabled: false
            # NodePort has no LoadBalancer status. Preserve Argo Ingress health
            # without publishing an unroutable node IP as an external endpoint.
            ingressEndpoint:
              hostname: localhost
        api:
          dashboard: false
          insecure: false
        core:
          strictTLSOptions: true
        service:
          spec:
            type: NodePort
            # Remains private on EKS; no public cloud load balancer is created.
            externalTrafficPolicy: Cluster
        ports:
          web:
            nodePort: 30080
          websecure:
            expose:
              default: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
